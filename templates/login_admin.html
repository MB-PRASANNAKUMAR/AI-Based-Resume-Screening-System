<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Restricted Access</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { 
            background: #0f172a; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        * { box-sizing: border-box; } /* Prevents padding from breaking width */

        .admin-card {
            background: #1e293b; 
            padding: 45px; 
            border-radius: 20px;
            width: 100%; 
            max-width: 420px; 
            border: 1px solid #334155;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: left;
        }

        .neon-accent { 
            color: #2dd4bf; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-size: 11px; 
            font-weight: 700;
        }

        .admin-input {
            width: 100%; 
            padding: 12px; 
            background: #0f172a; 
            border: 1px solid #334155;
            border-radius: 8px; 
            color: #2dd4bf; 
            margin-top: 8px; 
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .admin-input:focus {
            border-color: #2dd4bf;
        }

        .btn-admin {
            background: #2dd4bf; 
            color: #0f172a; 
            width: 100%; 
            padding: 14px;
            border: none; 
            border-radius: 8px; 
            font-weight: 900; 
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-admin:hover {
            background: #14b8a6;
            transform: translateY(-1px);
            box-shadow: 0 0 15px rgba(45, 212, 191, 0.4);
        }

        /* Flash Message Styling */
        .flash-msg {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            transition: opacity 0.5s ease;
        }
        .alert-error { background: #7f1d1d; color: #fecaca; border: 1px solid #991b1b; }
        .alert-success { background: #064e3b; color: #a7f3d0; border: 1px solid #065f46; }

        .register-box {
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
        }

        .register-link {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.3s;
        }

        .register-link:hover { color: #2dd4bf; }
    </style>
</head>
<body>

<div class="admin-card">
    <div style="text-align:center; margin-bottom:30px;">
        <span style="font-size:40px;">🛡️</span>
        <h2 style="margin:10px 0; letter-spacing: -1px;">Control Center</h2>
        <p class="neon-accent">Authorized Personnel Only</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash-msg alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/login/admin" method="POST">
        <label class="neon-accent">Admin ID</label>
        <input type="text" name="email" class="admin-input" autocomplete="off" required>
        
        <label class="neon-accent">Security Key</label>
        <input type="password" name="password" class="admin-input" required>
        
        <button type="submit" class="btn-admin">AUTHENTICATE</button>
    </form>

    <div class="register-box">
        <a href="/register/admin" class="register-link">
            Need specialized access? <b>Register New Admin</b>
        </a>
    </div>
</div>

<script>
    // Smoothly fade out and remove flash messages after 3 seconds
    setTimeout(() => {
        const messages = document.querySelectorAll('.flash-msg');
        messages.forEach(el => {
            el.style.opacity = '0';
            setTimeout(() => el.remove(), 500);
        });
    }, 3000);
</script>

</body>
</html>
