<!DOCTYPE html>
<html>
<head>
    <title>Submission Successful</title>
    <style>
        body { font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f8f9fa; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; max-width: 500px; }
        .icon { font-size: 50px; color: #10b981; margin-bottom: 20px; }
        h1 { color: #1e293b; margin-bottom: 10px; }
        p { color: #64748b; line-height: 1.6; margin-bottom: 30px; }
        .btn { background: #4f46e5; color: white; padding: 12px 30px; border-radius: 6px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #4338ca; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h1>Resume Submitted!</h1>
        <p>Your resume has been processed successfully. The next step is a 5-minute technical assessment to evaluate your skills.</p>
        <a href="/instructions/{{ job_id }}" class="btn">Proceed to Instructions</a>
    </div>
</body>
</html>
