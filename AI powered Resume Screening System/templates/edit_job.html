<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Job</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h2>✏️ Update Job</h2>

    <form method="post">
        {% with messages = get_flashed_messages(category_filter=["error"]) %}
        {% if messages %}
        <script>
            alert("❌ {{ messages[0] }}");
            document.getElementById("openings")?.focus();
        </script>
        {% endif %}
        {% endwith %}

        <!-- Job Title -->
        <label for="title"><strong>Job Title</strong></label>
        <input
            type="text"
            id="title"
            name="title"
            value="{{ job['title'] }}"
            required
        >

        <!-- Job Description -->
        <label for="desc"><strong>Job Description</strong></label>
        <textarea
            id="desc"
            name="desc"
            required
        >{{ job['description'] }}</textarea>

        <!-- Skills -->
        <label for="skills"><strong>Required Skills</strong></label>
        <input
            type="text"
            id="skills"
            name="skills"
            value="{{ job['skills'] }}"
            required
        >
        <label for="openings"><strong>Number of Openings</strong></label>
        <input
            type="number"
            id="openings"
            name="openings"
            value="{{ job['openings'] }}"
            min="{{ job['selected_count'] }}"
            step="1"
            oninput="this.value = Math.max(this.min, this.value)"
            onkeydown="if (event.key === '-' || event.key === 'e') event.preventDefault();"
            required
        >

        <!-- Experience -->
        <label for="experience"><strong>Required Experience (Years)</strong></label>
        <input
            type="number"
            id="experience"
            name="experience"
            value="{{ job['experience'] }}"
            min="0"
            required
        >

        <!-- Buttons -->
        <button type="submit" class="btn">💾 Save Changes</button>
        <a href="/admin" class="btn btn-danger">Cancel</a>

    </form>
</div>

</body>
</html>
