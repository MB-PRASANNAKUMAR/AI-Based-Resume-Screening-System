<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assessment Result</title>
    <style>
        /* Flexbox Centering */
        body {
            margin: 0;
            display: flex;
            justify-content: center; /* Horizontal center */
            align-items: center;     /* Vertical center */
            min-height: 100vh;      /* Full screen height */
            background-color: #fdf2f2; /* Light red tint for failure context */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .assessment-container {
            max-width: 450px;
            width: 90%;
            padding: 40px;
            background: white;
            text-align: center;
            border: 2px solid #dc3545; /* Red border */
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(220, 53, 69, 0.1);
        }

        .icon-circle {
            width: 70px;
            height: 70px;
            background: #f8d7da;
            color: #dc3545;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
        }

        .btn-submit {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            color: white;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            background: #5a6268 !important;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="assessment-container">
    <div class="icon-circle">!</div>
    <h2 style="color: #dc3545;">Not Quite There</h2>
    <p style="font-size: 1.1rem; color: #555;">
        You scored <strong>{{ score }}%</strong>. 
        <br>
        <span style="font-size: 0.9rem; color: #888;">A minimum of 80% is required to proceed.</span>
    </p>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
    <p style="color: #666;">Don't give up! Review your fundamentals and try applying for other positions later.</p>
    <a href="/user" class="btn-submit" style="background:#6c757d; text-decoration:none;">Back to Dashboard</a>
</div>

</body>
</html>
