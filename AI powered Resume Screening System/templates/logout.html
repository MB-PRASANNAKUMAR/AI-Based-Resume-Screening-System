<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging Out... | HireStream AI</title>
    <meta http-equiv="refresh" content="3;url=/">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
            text-align: center;
        }
        .logout-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { color: #1e293b; }
        p { color: #64748b; }
    </style>
</head>
<body>

<div class="logout-container">
    <div class="loader"></div>
    <h2>Logging You Out</h2>
    <p>You have been safely logged out. Redirecting to home page...</p>
    <small><a href="/" style="color: #6366f1; text-decoration: none;">Click here if you aren't redirected</a></small>
</div>

<script>
    setTimeout(function() {
        window.location.href = "/";
    }, 3000); // 3000 milliseconds = 3 seconds
</script>

</body>
</html>
